name: Validation Firefox MediaRecorder

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/firefox-mediarecorder.yml"
      - "backend/server.js"
      - "src/components/MeetingMode.jsx"
      - "src/features/meetings/**"
      - "src/lib/audio-chunk-queue.js"
      - "src/lib/audio-chunk-sync.js"
      - "src/lib/local-api.js"
      - "scripts/validate-firefox-mediarecorder.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  firefox-mediarecorder:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Installer Playwright Firefox sans modifier le lockfile
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install firefox
      - name: Installer ffmpeg/ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vérifier MediaRecorder Firefox par tranches de 5 secondes
        run: node scripts/validate-firefox-mediarecorder.mjs
