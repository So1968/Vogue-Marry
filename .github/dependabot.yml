version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    target-branch: "main"
    groups:
      vite-security:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "launch-editor"
    commit-message:
      prefix: "security"
