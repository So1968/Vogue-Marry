name: Réparer Vite et valider le lockfile (PR 45)
on:
  push:
    branches:
      - security/vite-dependabot
    paths:
      - .github/workflows/security-vite-repair.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-vite:
    if: github.ref == 'refs/heads/security/vite-dependabot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Mettre à jour Vite et régénérer le verrouillage npm
        run: npm install --save-exact vite@8.3.5
      - name: Installation reproductible
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Compilation
        run: npm run build
      - name: Contrôle des vulnérabilités élevées
        run: npm audit --audit-level=high
      - name: Enregistrer package.json et package-lock.json ensemble
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "security: upgrade Vite to 8.3.5 with generated npm lockfile"
            git push origin HEAD:security/vite-dependabot
          fi
