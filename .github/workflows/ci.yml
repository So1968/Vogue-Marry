name: Vogue Marry CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier la syntaxe Node
        run: |
          node --check backend/server.js
          node --check backend/transcription-server-v6.js

      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile backend/local_transcribe.py backend/local_diarize.py

      - name: Vérifier le lint
        run: npm run lint

      - name: Lancer les tests de consolidation
        run: npm test

      - name: Construire le frontend
        run: npm run build

      - name: Auditer toutes les dépendances
        run: npm audit --audit-level=high

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer Python natif
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier les chemins, ACL et services natifs Windows
        run: node --test --test-concurrency=1 tests/platform-runtime.test.mjs tests/backend-path-guards.test.mjs tests/windows-runtime.test.mjs tests/backup-runtime.test.mjs tests/json-lines-process.test.mjs
      - name: Construire le frontend sous Windows
        run: npm run build
